<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一站式AI资源导航平台，汇集AI工具、教程、Prompt模板及最新资讯">
  <meta name="keywords" content="AI导航, AI工具, ChatGPT, 教程, Prompt, 人工智能">
  <title>AI 导航站 | 一站式AI资源平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="header">
    <h1>🧠 AI 资源中心</h1>
    <p>工具导航 · 教程指南 · 实用工具 · 最新资讯</p>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-section="tools">🔗 工具导航</button>
    <button class="nav-tab" data-section="tutorials">📚 教程指南</button>
    <button class="nav-tab" data-section="utils">🛠️ 实用工具</button>
    <button class="nav-tab" data-section="prompts">💡 Prompt模板</button>
    <button class="nav-tab" data-section="news">📰 AI资讯</button>
    <button class="nav-tab" data-section="glossary">📖 名词解释</button>
  </div>

  <div class="controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="搜索资源..." aria-label="搜索AI资源">
    </div>
    <button class="btn" id="theme-toggle">🌓 主题</button>
    <button class="btn" id="show-bookmarks">⭐ 收藏</button>
  </div>

  <div class="stats" id="stats"></div>

  <div id="app">
    <div id="section-tools" class="content-section active" style="display: none;"></div>
    <div id="section-tutorials" class="content-section" style="display: none;"></div>
    <div id="section-utils" class="content-section" style="display: none;"></div>
    <div id="section-prompts" class="content-section" style="display: none;"></div>
    <div id="section-news" class="content-section" style="display: none;"></div>
    <div id="section-glossary" class="content-section" style="display: none;"></div>

    <!-- <div id="section-tools" class="content-section active"></div>
    <div id="section-tutorials" class="content-section"></div>
    <div id="section-utils" class="content-section"></div>
    <div id="section-prompts" class="content-section"></div>
    <div id="section-news" class="content-section"></div>
    <div id="section-glossary" class="content-section"></div> -->
  </div>

  <div class="footer">
    <p>💾 数据存在 GitHub | 🚀 托管于 Cloudflare Pages | 随时可扩展</p>
    <p style="margin-top: 8px; font-size: 12px;">共收录 <span id="total-count">0</span> 个资源</p>
  </div>


  <script src="js/config.js" defer></script>
  <script src="js/utils/storage.js" defer></script>
  <script src="js/utils/helpers.js" defer></script>
  <script src="js/components/tools.js" defer></script>
  <script src="js/components/tutorials.js" defer></script>
  <script src="js/components/utils.js" defer></script>
  <script src="js/components/prompts.js" defer></script>
  <script src="js/components/news.js" defer></script>
  <script src="js/components/glossary.js" defer></script>
  <script src="js/app.js" defer></script>

</body>

</html>
